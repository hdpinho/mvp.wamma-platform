spring:
  application:
    name: wamma-platform

  # Desde la etapa 1 el backend siempre necesita base de datos: el control de accesos
  # (módulo 001) vive en ella. Las pruebas de integración usan un PostgreSQL embebido.
  profiles:
    # Por defecto, local: arrancar sin configurar entorno NO puede apuntar a la base
    # compartida. El perfil `supabase` se activa explícitamente (SPRING_PROFILES_ACTIVE).
    default: local

  # Fotos de vehículos (plan 005 §5): una por petición, hasta 10 MB.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # Migrar no es el comportamiento implícito: cada entorno decide. Render lo pone en true;
  # el perfil `local` lo habilita porque su base nace vacía en cada arranque.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${PORT:${SERVER_PORT:8080}}
  # La IP del cliente se resuelve descartando los proxies de confianza de derecha a
  # izquierda en X-Forwarded-For. `framework` tomaba el PRIMER elemento, que es el que el
  # cliente controla: detrás de un balanceador que añade en vez de reemplazar —un ALB de
  # AWS, por ejemplo— bastaba una cabecera falsificada para evadir el límite y ensuciar la
  # bitácora. `native` usa RemoteIpValve de Tomcat, que sí descarta proxies conocidos.
  forward-headers-strategy: ${WAMMA_ESTRATEGIA_CABECERAS:native}
  tomcat:
    remoteip:
      # Rangos de los que SÍ se acepta X-Forwarded-For. Por defecto, redes privadas y
      # loopback, que es lo correcto tras un ALB en una VPC. En Render hay que fijarlo a
      # la IP real de su proxy: obsérvala en la bitácora antes de activarla, porque un
      # rango mal puesto hace que todas las peticiones parezcan venir de la misma IP y
      # deja fuera al backoffice entero.
      internal-proxies: ${WAMMA_PROXIES_CONFIABLES:10\.\d\d?\d?\.\d\d?\d?\.\d\d?\d?|192\.168\.\d\d?\d?\.\d\d?\d?|169\.254\.\d\d?\d?\.\d\d?\d?|127\.\d\d?\d?\.\d\d?\d?\.\d\d?\d?|172\.1[6-9]\.\d\d?\d?\.\d\d?\d?|172\.2\d\.\d\d?\d?\.\d\d?\d?|172\.3[0-1]\.\d\d?\d?\.\d\d?\d?|0:0:0:0:0:0:0:1|::1}

wamma:
  cors:
    # Orígenes del frontend autorizados a llamar a la API, separados por coma.
    # Nunca un comodín. En Render: WAMMA_CORS_ORIGINS=https://wamma-mvp.vercel.app
    allowed-origins: ${WAMMA_CORS_ORIGINS:http://localhost:5173}

  security:
    # Claves de 32 bytes en Base64 (plan 001 §7). Sin ellas el servidor no arranca.
    encryption-key: ${WAMMA_CLAVE_CIFRADO:}
    index-key: ${WAMMA_CLAVE_INDICE:}
    # Valores aprobados por el PO (D-24).
    session-idle-timeout: 30m
    session-max-duration: 12h
    partial-session-ttl: 5m
    password-min-length: 12
    max-failed-attempts: 5
    lockout-duration: 15m
    # Tras estos fallos seguidos, el identificador queda congelado el tiempo de la ventana
    # (plan 001, S6). Es el techo duro; el retardo de abajo actúa mucho antes.
    login-attempts-per-ip: 20
    login-ip-window: 10m
    # Retardo progresivo por fallos seguidos, en segundos (D-40). El último valor es el
    # tope. El servidor no duerme: responde 429 con Retry-After y libera el hilo.
    login-delay-curve-seconds: [0, 1, 2, 4, 8]

  # Primer administrador (D-07). Solo se usa si la base no tiene ningún usuario.
  bootstrap-admin:
    username: ${WAMMA_ADMIN_USUARIO:}
    first-name: ${WAMMA_ADMIN_NOMBRE:}
    last-name: ${WAMMA_ADMIN_APELLIDO:}
    email: ${WAMMA_ADMIN_CORREO:}
    initial-password: ${WAMMA_ADMIN_CONTRASENA_INICIAL:}

  # Fotos de los vehículos (plan 005 §5, D-09). En local y en pruebas, en disco y servidas
  # por el backend; en producción, en Supabase Storage por su API S3 (perfil supabase).
  fotos:
    almacen: ${WAMMA_FOTOS_ALMACEN:disco}
    url-publica: ${WAMMA_FOTOS_URL_PUBLICA:http://localhost:8080/archivos}
    disco:
      carpeta: ${WAMMA_FOTOS_CARPETA:${java.io.tmpdir}/wamma-fotos}
    s3:
      endpoint: ${WAMMA_S3_ENDPOINT:}
      region: ${WAMMA_S3_REGION:}
      bucket: ${WAMMA_S3_BUCKET:vehiculos}
      access-key: ${WAMMA_S3_ACCESS_KEY:}
      secret-key: ${WAMMA_S3_SECRET_KEY:}

  # Carga inicial de los vehículos de demostración (D-10, D-25). Solo actúa con el
  # inventario vacío: se activa en el primer despliegue y en el servidor local.
  demo:
    cargar-inventario: ${WAMMA_DEMO_CARGAR_INVENTARIO:false}

logging:
  level:
    com.wamma: ${LOG_LEVEL_WAMMA:INFO}
    org.springframework.security: INFO

---
# ── Perfil local (el de por defecto) ──────────────────────────────────────────
# Desarrollo y pruebas sobre un PostgreSQL embebido y desechable. No define datasource:
# lo aportan `LocalDevServer` o las pruebas de integración. Sin esos valores el arranque
# falla, que es justo lo que debe pasar si alguien activa este perfil sin base propia.
spring:
  config:
    activate:
      on-profile: local

  # La base nace vacía en cada arranque: sin migraciones no habría esquema.
  flyway:
    enabled: true

---
# ── Perfil supabase (producción; SPRING_PROFILES_ACTIVE=supabase) ─────────────
# Ninguna variable de este bloque tiene valor por defecto. Un respaldo silencioso deja
# el servidor arrancando en verde contra el destino equivocado, y eso es peor que no
# arrancar. Las que faltan las nombra todas juntas `VariablesRequeridas` al arrancar.
spring:
  config:
    activate:
      on-profile: supabase

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}

  flyway:
    # Flyway migra con credenciales propias, nunca con las de la aplicación: así el rol
    # del backend (wamma_app, V0009) puede no tener DDL sin que las migraciones dejen de
    # correr. Sin respaldo a SUPABASE_DB_*: si se quieren iguales, se declaran iguales.
    user: ${FLYWAY_DB_USER}
    password: ${FLYWAY_DB_PASSWORD}
    # Sin baseline automático: un esquema con tablas y sin historial de Flyway es un error
    # que debe verse, no algo que se adopta en silencio. Supabase se registró una única vez
    # con baseline en la versión 8 (specs/000-overview/database-schema-design.md §5).
    baseline-on-migrate: false

wamma:
  fotos:
    # En producción, siempre S3: el disco de Render se borra en cada despliegue.
    almacen: ${WAMMA_FOTOS_ALMACEN:s3}
    # Sin respaldo a localhost: con él, el servidor arrancaba verde sirviendo URLs de
    # foto inservibles. Y sin respaldo a "vehiculos": el bucket se declara.
    url-publica: ${WAMMA_FOTOS_URL_PUBLICA}
    s3:
      bucket: ${WAMMA_S3_BUCKET}
