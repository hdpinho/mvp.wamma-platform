spring:
  application:
    name: wamma-platform

  # ── Supabase PostgreSQL ──────────────────────────────────────────────
  # Conexión real en variables de entorno o perfil local.
  # Nunca secretos en este archivo (Constitución, Principio VI).
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/wamma}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gestiona el esquema; Hibernate solo valida.
    open-in-view: false           # Evitar lazy-loading fuera de transacción.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Flyway ───────────────────────────────────────────────────────────
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis ────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:${SERVER_PORT:8080}}

# ── Logging ──────────────────────────────────────────────────────────
logging:
  level:
    com.wamma: DEBUG
    org.springframework.security: INFO
