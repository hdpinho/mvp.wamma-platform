spring:
  application:
    name: wamma-platform

  profiles:
    default: standalone

server:
  port: ${PORT:${SERVER_PORT:8080}}

logging:
  level:
    com.wamma: DEBUG
    org.springframework.security: INFO

---
# ── Perfil Standalone (por defecto para maqueta / arranque sin base de datos) ──
spring:
  config:
    activate:
      on-profile: standalone
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

---
# ── Perfil Supabase (se activa al configurar SPRING_PROFILES_ACTIVE=supabase) ──
spring:
  config:
    activate:
      on-profile: supabase

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/wamma}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # Flyway migra con el dueño del esquema. Así la aplicación puede conectarse con un
    # rol de menos privilegios (wamma_app, V0009) sin que las migraciones dejen de correr.
    user: ${FLYWAY_DB_USER:${SUPABASE_DB_USER:postgres}}
    password: ${FLYWAY_DB_PASSWORD:${SUPABASE_DB_PASSWORD:}}
    # Sin baseline automático: un esquema con tablas y sin historial de Flyway es un error
    # que debe verse, no algo que se adopta en silencio. Supabase se registró una única vez
    # con baseline en la versión 8 (specs/000-overview/database-schema-design.md §5).
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
