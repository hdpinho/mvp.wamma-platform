spring:
  application:
    name: wamma-platform

  profiles:
    default: standalone

server:
  port: ${PORT:${SERVER_PORT:8080}}

logging:
  level:
    com.wamma: DEBUG
    org.springframework.security: INFO

---
# ── Perfil Standalone (por defecto para maqueta / arranque sin base de datos) ──
spring:
  config:
    activate:
      on-profile: standalone
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

---
# ── Perfil Supabase (se activa al configurar SPRING_PROFILES_ACTIVE=supabase) ──
spring:
  config:
    activate:
      on-profile: supabase

  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/wamma}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
